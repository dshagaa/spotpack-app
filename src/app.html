<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('spotpack-theme');
          const mode = ['day', 'night', 'system'].includes(stored) ? stored : 'system';
          const dark = mode === 'night' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.dataset.theme = mode;
        } catch {
          // Theme initialization is best effort before the app hydrates.
        }
      })();
    </script>
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <meta name="theme-color" content="#070910" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
